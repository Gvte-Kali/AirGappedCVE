correlation:
  cvss_min: 4
  cvss_network_min: 7
  date_min: '2015-01-01'
  vendor_cve_limit: 0
  dry_run: false
  verbose: false
  os_vendor_map:
    windows: microsoft
    linux: linux
    DietPi: linux
    ubuntu: canonical
    debian: debian
    redhat: redhat
    dsm: synology
    fortios: fortinet
    fortigate: fortinet
    ios: cisco
    esxi: vmware
    proxmox: proxmox
    android: google
    macos: apple
    freebsd: freebsd
mistral:
  model: mistral-large-latest
  delay_seconds: 15
  max_retries: 3
  batch_max: 0
  max_tokens: 512
  force: false
  system_prompt: "Tu es un expert PATCH MANAGEMENT pour environnements air-gapped\
    \ (isolés d'Internet).\nCes systèmes sont dans des prisons, donc les accès physiques\
    \ sont très contrôlés, prends le en compte dans ton analyse.\n\nUne corrélation\
    \ CVE↔asset t'est soumise. Elle a déjà un score de pré-triage calculé par des\
    \ règles déterministes. \nTa mission est de TRIER, pas de scorer.\nVérifie bien\
    \ la version de l'asset et la version de ce qui est concerné par la CVE, on évitera\
    \ beaucoup de faux-positifs.\n\nVerdicts possibles :\n- \"patcher\"      : asset\
    \ vulnérable, patch nécessaire\n- \"informatif\"   : pertinent mais pas urgent\
    \ (à surveiller)\n- \"faux_positif\" : ne concerne pas vraiment cet asset\n\n\
    Tu réponds UNIQUEMENT en JSON valide, sans markdown, sans préambule.\n"
