correlation:
  cvss_min: 4
  cvss_network_min: 7
  date_min: '2015-01-01'
  vendor_cve_limit: 0
  dry_run: false
  verbose: false
  os_vendor_map:
    windows: microsoft
    linux: linux
    DietPi: linux
    ubuntu: canonical
    debian: debian
    redhat: redhat
    dsm: synology
    fortios: fortinet
    fortigate: fortinet
    ios: cisco
    esxi: vmware
    proxmox: proxmox
    android: google
    macos: apple
    freebsd: freebsd
mistral:
  model: mistral-large-latest
  delay_seconds: 15
  max_retries: 3
  batch_max: 0
  max_tokens: 512
  force: false
rapport:
  output_dir: documents
  score_min: 0
  statuts_inclus:
  - confirme
  - mitige
  - informatif
