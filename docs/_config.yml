remote_theme: just-the-docs/just-the-docs

title: Asset & Vulnerability Manager
description: >
  Documentation technique — Système de gestion d'assets informatiques
  et de vulnérabilités CVE pour environnements air-gappés.

url: ""

color_scheme: dark

search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

nav_sort: order

aux_links:
  "API Docs": "/docs"

aux_links_new_tab: true

heading_anchors: true

back_to_top: true
back_to_top_text: "Haut de page"

footer_content: "Asset &amp; Vulnerability Manager — Documentation technique"

gh_edit_link: false

plugins:
  - jekyll-seo-tag

exclude:
  - "*.gemspec"
  - Gemfile
  - Gemfile.lock
