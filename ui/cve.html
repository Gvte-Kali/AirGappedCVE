<!DOCTYPE html>
<html lang="fr" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <title>Vulnérabilités CVE</title>
    <link rel="stylesheet" href="/static/bootstrap.min.css">
    <link rel="stylesheet" href="/static/app-search.css">
    <link rel="stylesheet" href="/static/app-premium.css">
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
        }

        .card,
        .modal-content {
            background-color: #161b22;
            border-color: #30363d;
        }

        .table {
            color: #c9d1d9;
        }

        .badge-critique {
            background-color: #f85149;
        }

        .badge-haute {
            background-color: #f0883e;
        }

        .badge-moyenne {
            background-color: #d29922;
        }

        .badge-basse {
            background-color: #3fb950;
        }

        thead.sticky-header th {
            background-color: #0d1117;
            box-shadow: 0 1px 0 #30363d;
        }

        /* Style pour le typeahead */
        .suggestion-box {
            position: absolute;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 4px;
            z-index: 1000;
            width: 100%;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }

        .suggestion-item {
            padding: 6px 12px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .suggestion-item:hover {
            background-color: #0d1117;
        }
    </style>
</head>

<body>
    <!-- NAVBAR (identique à ton exemple) -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">🛡️ Air-Gapped CVEs</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="nav">
                <div class="d-flex ms-auto align-items-center gap-2">
                    <ul class="navbar-nav ms-2 align-items-center gap-1">
                        <li class="nav-item"><a class="nav-link" href="/">Accueil</a></li>
                        <li class="nav-item"><a class="nav-link" href="/ui/vulns">Vulnérabilités</a></li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" role="button"
                                data-bs-toggle="dropdown">Inventaire</a>
                            <ul class="dropdown-menu dropdown-menu-dark">
                                <li><a class="dropdown-item" href="/ui/clients">👥 Clients</a></li>
                                <li><a class="dropdown-item" href="/ui/sites">🏢 Sites</a></li>
                                <li><a class="dropdown-item" href="/ui/assets">💻 Assets</a></li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- CONTENU -->
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-end mb-5">
            <div>
                <h6 class="section-title mb-2">Sécurité & Risques</h6>
                <h1 class="fw-bold m-0 stat-number">VULNÉRABILITÉS CVE</h1>
            </div>
        </div>

        <!-- FILTRES -->
        <div class="card mb-4">
            <div class="p-4">
                <h6 class="section-title mb-3">🔍 FILTRES</h6>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label stat-label">Numéro de CVE</label>
                        <input type="text" class="form-control" id="filtreCVE" placeholder="ex: CVE-2024-...">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label stat-label">Fabricant</label>
                        <div class="position-relative">
                            <input type="text" class="form-control" id="filtreFabricantSearch"
                                placeholder="Tous les fabricants…" autocomplete="off">
                            <input type="hidden" id="filtreFabricantId">
                            <div class="suggestion-box" id="filtreFabricantSuggestions"></div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label stat-label">Type de vulnérabilité</label>
                        <select class="form-select" id="filtreType">
                            <option value="">Tous les types</option>
                        </select>
                    </div>
                </div>
                <div class="d-flex gap-2 mt-4">
                    <button class="btn btn-primary" onclick="chargerCVE(1)">🔍 Rechercher</button>
                    <button class="btn btn-outline-secondary" onclick="reinitialiserFiltres()">🔄 Réinitialiser</button>
                </div>
            </div>
        </div>

        <!-- TABLEAU DES CVE -->
        <div class="card mb-4">
            <div class="table-responsive" style="overflow: visible;">
                <table class="table table-hover align-middle mb-0">
                    <thead class="sticky-header" style="position: sticky; top: 56px; z-index: 10;">
                        <tr>
                            <th class="ps-4">CVE ID</th>
                            <th>Fabricant</th>
                            <th>Produit</th>
                            <th>Type</th>
                            <th>CVSS v3</th>
                            <th>Sévérité</th>
                            <th>Description</th>
                            <th>Date publication</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="8" class="text-center">Aucune CVE trouvée</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- PAGINATION -->
        <nav id="paginationContainer">
            <ul class="pagination justify-content-center" id="pagination"></ul>
        </nav>
    </div>

    <script src="/static/bootstrap.bundle.min.js"></script>
    <script>
        // =============================================
        // CONFIGURATION
        // =============================================
        let pageActuelle = 1;
        const itemsParPage = 10; // <-- 10 CVE par page
        let fabricants = [];
        let types = [];

        // =============================================
        // TYPEAHEAD POUR FABRICANT (inspiré de ton exemple)
        // =============================================
        function makeSuggestionBox(inputId, hiddenId, boxId, fetcher, labelFn) {
            const input = document.getElementById(inputId);
            const hidden = hiddenId ? document.getElementById(hiddenId) : null;
            const box = document.getElementById(boxId);
            let debounce;

            async function doSearch() {
                clearTimeout(debounce);
                debounce = setTimeout(async () => {
                    const q = input.value.trim();
                    try {
                        const items = await fetcher(q);
                        box.innerHTML = '';
                        if (!items.length) {
                            box.innerHTML = '<div class="suggestion-item text-secondary">Aucun résultat</div>';
                            box.style.display = 'block';
                            return;
                        }
                        items.slice(0, 20).forEach(item => {
                            const div = document.createElement('div');
                            div.className = 'suggestion-item';
                            div.textContent = labelFn(item);
                            div.addEventListener('mousedown', e => {
                                e.preventDefault();
                                input.value = labelFn(item);
                                if (hidden) hidden.value = item.id || item.nom || labelFn(item);
                                box.style.display = 'none';
                            });
                            box.appendChild(div);
                        });
                        box.style.display = 'block';
                    } catch (e) {
                        console.error('Erreur typeahead:', e);
                        box.style.display = 'none';
                    }
                }, 150);
            }

            input.addEventListener('focus', doSearch);
            input.addEventListener('input', () => {
                if (hidden) hidden.value = '';
                doSearch();
            });
            input.addEventListener('blur', () => setTimeout(() => box.style.display = 'none', 200));
        }

        // =============================================
        // CHARGEMENT DES FILTRES (fabricants, types)
        // =============================================
        async function chargerFiltres() {
            try {
                // Charge les fabricants pour le typeahead
                const fabRes = await fetch('/api/cve/fabricants');
                fabricants = (await fabRes.json()).fabricants || [];

                // Charge les types de vulnérabilités
                const typeRes = await fetch('/api/cve/types');
                types = (await typeRes.json()).types || [];

                // Remplit le select des types
                const typeSelect = document.getElementById('filtreType');
                typeSelect.innerHTML = '<option value="">Tous les types</option>';
                types.forEach(t => {
                    typeSelect.innerHTML += `<option value="${t}">${t}</option>`;
                });

                // Initialise le typeahead pour fabricant
                makeSuggestionBox(
                    'filtreFabricantSearch',
                    'filtreFabricantId',
                    'filtreFabricantSuggestions',
                    async q => {
                        if (!q) return fabricants.slice(0, 20);
                        return fabricants.filter(f => f.toLowerCase().includes(q.toLowerCase())).slice(0, 20);
                    },
                    i => i
                );

            } catch (e) {
                console.error('Erreur chargement filtres:', e);
            }
        }

        // =============================================
        // CHARGEMENT DES CVE (par pages de 10)
        // =============================================
        async function chargerCVE(page = 1) {
            pageActuelle = page;
            const skip = (page - 1) * itemsParPage;

            const params = new URLSearchParams({ limit: itemsParPage, skip });
            const cve = document.getElementById('filtreCVE').value;
            const fabricant = document.getElementById('filtreFabricantSearch').value;
            const type = document.getElementById('filtreType').value;

            if (cve) params.append('cve_id', cve);
            if (fabricant) params.append('fabricant', fabricant);
            if (type) params.append('type_vulnerabilite', type);

            try {
                const response = await fetch(`/api/cve/?${params}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                afficherTableau(data.items);
                afficherPagination(data.total);
            } catch (e) {
                console.error('Erreur:', e);
                document.getElementById('tableBody').innerHTML =
                    '<tr><td colspan="8" class="text-center text-danger">Erreur de chargement</td></tr>';
            }
        }

        // =============================================
        // AFFICHAGE DU TABLEAU
        // =============================================
        function afficherTableau(data) {
            const tbody = document.getElementById('tableBody');
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center">Aucune CVE trouvée</td></tr>';
                return;
            }

            tbody.innerHTML = data.map(cve => `
                <tr>
                    <td class="ps-4"><code>${cve.cve_id || 'N/A'}</code></td>
                    <td>${cve.fabricant || 'N/A'}</td>
                    <td>${cve.produit || 'N/A'}</td>
                    <td><span class="badge bg-secondary">${cve.type_attaque || 'N/A'}</span></td>
                    <td><span class="badge bg-secondary">${cve.cvss_v3_score || 'N/A'}</span></td>
                    <td>
                        <span class="badge badge-${cve.cvss_v3_severity?.toLowerCase() || 'basse'}">
                            ${cve.cvss_v3_severity || 'N/A'}
                        </span>
                    </td>
                    <td><small>${(cve.description || 'N/A').substring(0, 80)}...</small></td>
                    <td><small>${cve.date_publication || 'N/A'}</small></td>
                </tr>
            `).join('');
        }

        // =============================================
        // PAGINATION
        // =============================================
        function afficherPagination(total) {
            const nbPages = Math.ceil(total / itemsParPage);
            const pagination = document.getElementById('pagination');
            if (nbPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let html = `
                <li class="page-item ${pageActuelle === 1 ? 'disabled' : ''}">
                    <a class="page-link" href="#" onclick="chargerCVE(${pageActuelle - 1}); return false;">‹</a>
                </li>
            `;

            const debut = Math.max(1, pageActuelle - 2);
            const fin = Math.min(nbPages, pageActuelle + 2);
            for (let i = debut; i <= fin; i++) {
                html += `
                    <li class="page-item ${i === pageActuelle ? 'active' : ''}">
                        <a class="page-link" href="#" onclick="chargerCVE(${i}); return false;">${i}</a>
                    </li>
                `;
            }

            html += `
                <li class="page-item ${pageActuelle === nbPages ? 'disabled' : ''}">
                    <a class="page-link" href="#" onclick="chargerCVE(${pageActuelle + 1}); return false;">›</a>
                </li>
            `;
            pagination.innerHTML = html;
        }

        // =============================================
        // RÉINITIALISER LES FILTRES
        // =============================================
        function reinitialiserFiltres() {
            document.getElementById('filtreCVE').value = '';
            document.getElementById('filtreFabricantSearch').value = '';
            document.getElementById('filtreFabricantId').value = '';
            document.getElementById('filtreType').value = '';
            chargerCVE(1);
        }

        // =============================================
        // INITIALISATION
        // =============================================
        document.addEventListener('DOMContentLoaded', () => {
            chargerFiltres();
            chargerCVE(1); // Charge la première page (10 CVE)
        });
    </script>
</body>

</html>
